      <div class="content-inner">
        <p class="breadcrumb"><a href="index.html">Grammar</a> / Articles</p>
        <h1>Articles</h1>
        <p>French nouns have a gender (masculine or feminine) and the article must agree with it.</p>

        <div class="example">
          <div class="fr">le chat (m.), la table (f.), les livres (pl.)</div>
          <div class="en">the cat, the table, the books</div>
        </div>
        <div class="example">
          <div class="fr">un chat (m.), une table (f.), des livres (pl.)</div>
          <div class="en">a cat, a table, some books</div>
        </div>

        <footer>
          <p>&copy; <span id="year"></span> Apprendre le français</p>
        </footer>
      </div>
    </div>
